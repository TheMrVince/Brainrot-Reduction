name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # a failure on one system must not hide the result on the others
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, then assemble the controller
        shell: bash
        run: ./gradlew --no-daemon :controller:test :controller:installDist

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report-${{ matrix.os }}
          path: controller/build/reports/tests/test

  cpp:
    # macOS and Windows build and test the whole enforcer, including the real platform adapter.
    # Linux has no adapter, so it builds and tests the portable core and the socket transport.
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S enforcer -B enforcer/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build enforcer/build --config Release --parallel

      - name: Test
        run: ctest --test-dir enforcer/build --build-config Release --output-on-failure

      - name: The enforcer program starts and refuses a missing command
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set +e
          exe=enforcer/build/enforcer
          if [ "$RUNNER_OS" = "Windows" ]; then exe=enforcer/build/Release/enforcer.exe; fi
          "$exe"
          status=$?
          echo "exit status: $status"
          [ "$status" -eq 2 ]

  scripts:
    name: Install scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for script in packaging/macos/*.sh; do
            bash -n "$script"
            echo "ok: $script"
          done
