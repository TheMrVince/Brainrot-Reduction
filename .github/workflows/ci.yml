name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # a failure on one system must not hide the result on the others
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Gradle itself is downloaded from a GitHub release, which sometimes times out. Fetch it in a
      # step of its own so only the download is retried, never the tests.
      - name: Fetch Gradle (retried)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --version && exit 0
            echo "Fetching Gradle failed (attempt $attempt); retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Test, then assemble the controller
        shell: bash
        run: ./gradlew --no-daemon :controller:test :controller:installDist

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report-${{ matrix.os }}
          path: controller/build/reports/tests/test

  cpp:
    # macOS and Windows build and test the whole enforcer, including the real platform adapter.
    # Linux has no adapter, so it builds and tests the portable core and the socket transport.
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Configuring downloads nlohmann/json from a GitHub release, which sometimes fails; try again
      # from a clean build folder.
      - name: Configure (retried)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cmake -S enforcer -B enforcer/build -DCMAKE_BUILD_TYPE=Release && exit 0
            echo "Configure failed (attempt $attempt); retrying in 20 s"
            rm -rf enforcer/build
            sleep 20
          done
          exit 1

      - name: Build
        run: cmake --build enforcer/build --config Release --parallel

      - name: Test
        run: ctest --test-dir enforcer/build --build-config Release --output-on-failure

      - name: The enforcer program starts and refuses a missing command
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set +e
          exe=enforcer/build/enforcer
          if [ "$RUNNER_OS" = "Windows" ]; then exe=enforcer/build/Release/enforcer.exe; fi
          "$exe"
          status=$?
          echo "exit status: $status"
          [ "$status" -eq 2 ]

  scripts:
    name: Install scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for script in packaging/macos/*.sh; do
            bash -n "$script"
            echo "ok: $script"
          done
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
            Write-Host "ok: $($script.Name)"
          }
